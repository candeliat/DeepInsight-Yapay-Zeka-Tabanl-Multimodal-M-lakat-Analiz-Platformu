# Backend birim/entegrasyon testleri (backend/tests). Supabase ve LLM testlerde taklit edilir
# (monkeypatch), gizli anahtar gerekmez. backend/ kökündeki test_*.py dosyaları canlı veritabanına
# bağlanan eski betiklerdir; CI'da çalıştırılmaz.
name: Backend testleri

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      # Gerçek servislere gidilmez; boş değerler istemcilerin kurulmamasını sağlar.
      SUPABASE_URL: ""
      SUPABASE_KEY: ""
      LLM_API_KEY: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      # Video/ses/OCR/yerel embedding modelleri (deepface, mediapipe, whisper, librosa, easyocr,
      # sentence-transformers) TensorFlow/PyTorch getirir ve birkaç GB'tır. Kodda yalnızca
      # kullanıldıkları anda import edilirler ve testler bu yolları taklit eder; CI'da kurulmaz.
      - name: Bağımlılıklar (ağır ML paketleri hariç)
        run: |
          grep -vE '^(deepface|tensorflow|tf-keras|mtcnn|mediapipe|openai-whisper|librosa|sentence-transformers|easyocr|soundfile|imageio-ffmpeg)\b' \
            requirements.txt > "$RUNNER_TEMP/requirements-ci.txt"
          cat "$RUNNER_TEMP/requirements-ci.txt"
          python -m pip install --upgrade pip
          pip install -r "$RUNNER_TEMP/requirements-ci.txt" $(grep -E "^pytest" requirements-dev.txt)

      - name: pytest
        run: python -m pytest tests -q -p no:cacheprovider
